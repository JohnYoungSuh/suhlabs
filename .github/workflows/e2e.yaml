name: E2E Tests & Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write # Required for Cosign keyless signing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.12.0
        with:
          config: bootstrap/kind-cluster.yaml
          cluster_name: integration-test

      - name: Deploy Foundation Stack
        run: |
          kubectl cluster-info
          # Example apply script for Vault + Cert Manager
          kubectl apply -k cluster/foundation/

      - name: Wait for Pod Readiness
        run: |
          kubectl wait --for=condition=Ready pods -n vault -l app.kubernetes.io/name=vault --timeout=300s
          kubectl wait --for=condition=Ready pods -n cert-manager --all --timeout=300s

      - name: E2E Integration Checks
        run: |
          # 1. Verify Cert-Manager webhook is executing properly
          kubectl get endpoints -n cert-manager cert-manager-webhook || echo "Warning: Cert-Manager EPs missing"
          # 2. Check Vault Sealing status (Fail if sealed unexpectedly without auto-unseal configs)
          kubectl exec -n vault vault-0 -- vault status | grep -q 'Sealed.*true' && echo 'Vault is sealed! Assert failing' && exit 1 || echo "Vault is unsealed or pending!"
          # 3. Apply inference payload
          kubectl apply -f cluster/workloads/ai-inference/deployment.yaml
          # Wait and assert AI integration agent startup actually succeeds
          kubectl wait --for=condition=Ready pods -n ai-ops -l app=ai-ops-agent --timeout=60s
          echo "E2E assertions completed!"

  publish-images:
    needs: e2e-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push AIOpsAgent Operator
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: cluster/operators/ai-ops-operator/
          push: true
          tags: ghcr.io/suhlabs/ai-ops-operator:latest
          platforms: linux/amd64,linux/arm64

      - name: Sign Image with Cosign
        run: |
          cosign sign --yes ghcr.io/suhlabs/ai-ops-operator@${{ steps.build-and-push.outputs.digest }}

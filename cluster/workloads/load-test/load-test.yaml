apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-load-test
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: load-test
        image: curlimages/curl
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting E2E load test..."
          for i in $(seq 1 100); do
            curl -s -o /dev/null -w "%{http_code}\n" http://ai-ops-agent.default.svc.cluster.local:8000/health || true
            sleep 0.1
          done
          echo "Load test completed."
      restartPolicy: Never
  backoffLimit: 1

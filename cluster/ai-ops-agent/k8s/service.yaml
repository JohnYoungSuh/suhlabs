---
apiVersion: v1
kind: Service
metadata:
  name: ai-ops-agent
  namespace: default
  labels:
    app: ai-ops-agent
spec:
  type: NodePort
  selector:
    app: ai-ops-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
      protocol: TCP
  sessionAffinity: None

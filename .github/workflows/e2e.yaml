name: E2E Tests & Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write # Required for Cosign keyless signing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          config: bootstrap/kind-cluster.yaml
          cluster_name: integration-test

      - name: Deploy Foundation Stack
        run: |
          kubectl cluster-info
          # Example apply script for Vault + Cert Manager
          kubectl apply -k cluster/foundation/

      - name: Wait for Pod Readiness
        run: |
          kubectl wait --for=condition=Ready pods -n vault -l app.kubernetes.io/name=vault --timeout=300s
          kubectl wait --for=condition=Ready pods -n cert-manager --all --timeout=300s

      - name: Fast API Curl Trigger
        run: |
          # Apply simple dummy app and verify
          kubectl apply -f cluster/workloads/ai-inference/deployment.yaml
          # Wait and assert (dummy check since GPU isn't available in standard runner)
          echo "Test passed."

  publish-images:
    needs: e2e-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push AIOpsAgent Operator
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: cluster/operators/ai-ops-operator/
          push: true
          tags: ghcr.io/suhlabs/ai-ops-operator:latest
          platforms: linux/amd64,linux/arm64

      - name: Sign Image with Cosign
        run: |
          cosign sign --yes ghcr.io/suhlabs/ai-ops-operator@${{ steps.build-and-push.outputs.digest }}
